<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Student | Admin Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #6366f1;
            --primary-hover: #4f46e5;
            --bg-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --glass-bg: rgba(255, 255, 255, 0.95);
            --text-main: #1f2937;
            --text-muted: #6b7280;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            color: var(--text-main);
        }

        .form-card {
            background: var(--glass-bg);
            padding: 2.5rem;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            width: 100%;
            max-width: 400px;
            backdrop-filter: blur(10px);
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            margin: 0 0 1.5rem 0;
            font-weight: 600;
            color: var(--primary-color);
            text-align: center;
            font-size: 1.75rem;
            letter-spacing: -0.025em;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text-muted);
        }

        input[type="text"],
        input[type="number"] {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            font-size: 1rem;
            font-family: inherit;
            transition: all 0.2s ease;
            box-sizing: border-box; /* Important pentru padding */
        }

        input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
        }

        input::placeholder {
            color: #9ca3af;
        }

        input[type="submit"] {
            width: 100%;
            background: var(--primary-color);
            color: white;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 1rem;
            box-shadow: 0 4px 6px -1px rgba(99, 102, 241, 0.4);
        }

        input[type="submit"]:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 10px 15px -3px rgba(99, 102, 241, 0.5);
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.875rem;
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: var(--primary-color);
        }
    </style>
</head>
<body>

    <div class="form-card">
        <h1>Adaugare angajat</h1>

        {% if error %}
        <p style="color:red; text-align:center;">{{ error }}</p>
        {% endif %}

        <form method="POST" action="{{ url_for('add') }}">
            <div class="form-group">
                <label for="cnp">CNP</label>
                <input type="text" id="cnp" name="cnp" placeholder="13 cifre"  required>
            </div>

            <div class="form-group">
                <label for="nume">Nume</label>
                <input type="text" id="nume" name="nume" placeholder="Popescu" required>
            </div>

            <div class="form-group">
                <label for="prenume">Prenume</label>
                <input type="text" id="prenume" name="prenume" placeholder="Ion" required>
            </div>

            <div class="form-group">
                <label for="varsta">Varsta</label>
                <input type="number" id="varsta" name="varsta" min="18" required>
            </div>

            <div class="form-group">
                <label for="salariu">Salariu</label>
                <input type="number" id="salariu" name="salariu" min="4050" required>
            </div>

            <div class="form-group">
                <label for="departament">Departament</label>
                <input type="text" id="departament" name="departament" placeholder="IT / HR / Financiar" required>
            </div>

            <div class="form-group">
                <label for="senioritate">Senioritate</label>
                <select id="senioritate" name="senioritate" required>
                    <option value="junior">junior</option>
                    <option value="mid">mid</option>
                    <option value="senior">senior</option>
                </select>
            </div>

            <input type="submit" value="Adauga angajat">
        </form>

        <a href="{{ url_for('home') }}" class="back-link">← Inapoi la pagina principala</a>
    </div>

</body>
</html>
